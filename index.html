
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>iOS Device Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #f8fafc;
      background: #0b1020;
    }

    header {
      padding: 28px 20px;
      background: linear-gradient(135deg, #172554, #312e81);
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      color: #cbd5e1;
      margin: 0;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-top: 28px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .item {
      padding: 18px 12px;
      text-align: left;
      color: white;
      background: #151d30;
      border: 1px solid #334155;
      border-radius: 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .item:active {
      background: #263552;
      transform: scale(.98);
    }

    .emoji {
      display: block;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: #a5b4fc;
      line-height: 1.5;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #475569;
      border-radius: 14px;
      background: #111827;
      line-height: 1.6;
    }

    video {
      width: 100%;
      max-height: 400px;
      margin-top: 16px;
      border-radius: 16px;
      background: black;
    }

    .action {
      display: inline-block;
      margin: 6px 4px 6px 0;
      padding: 10px 14px;
      color: white;
      background: #4338ca;
      text-decoration: none;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      margin-top: 12px;
    }

    footer {
      padding: 24px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      main {
        padding: 12px;
      }

      .item {
        padding: 14px 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1> Device Hub</h1>
    <p>Shortcuts & tools for your iPhone</p>
  </header>

  <main>
    <h2>System Shortcuts</h2>

    <div class="grid">
      <button class="item" onclick="showGuide('brightness')">
        <span class="emoji">☀️</span>
        Kecerahan Layar
        <span class="description">
          Atur kecerahan fisik iPhone
        </span>
      </button>

      <button class="item" onclick="showGuide('flashlight')">
        <span class="emoji">🔦</span>
        Senter iPhone
        <span class="description">
          Nyalakan senter bawaan
        </span>
      </button>

      <button class="item" onclick="openSafari()">
        <span class="emoji">🧭</span>
        Safari
        <span class="description">
          Buka situs di browser
        </span>
      </button>

      <button class="item" onclick="showGuide('home')">
        <span class="emoji">🏠</span>
        Home Screen
        <span class="description">
          Tambahkan portal ke layar utama
        </span>
      </button>
    </div>

    <h2>Camera & Files</h2>

    <div class="grid">
      <button class="item" onclick="startCamera()">
        <span class="emoji">📷</span>
        Buka Kamera
        <span class="description">
          Minta izin kamera
        </span>
      </button>

      <button class="item" onclick="stopCamera()">
        <span class="emoji">⏹️</span>
        Tutup Kamera
        <span class="description">
          Hentikan akses kamera
        </span>
      </button>

      <button class="item" onclick="document.getElementById('gallery').click()">
        <span class="emoji">🖼️</span>
        Galeri
        <span class="description">
          Pilih foto atau video
        </span>
      </button>

      <button class="item" onclick="document.getElementById('files').click()">
        <span class="emoji">📁</span>
        Pilih File
        <span class="description">
          Buka pemilih file
        </span>
      </button>
    </div>

    <video id="camera" autoplay playsinline muted hidden></video>

    <div id="cameraActions" hidden>
      <button class="action" onclick="takePhoto()">
        Ambil Foto
      </button>
      <button class="action" onclick="toggleRecording()">
        Rekam / Hentikan Video
      </button>
      <canvas id="canvas" hidden></canvas>
    </div>

    <div id="preview"></div>

    <input id="gallery" type="file"
      accept="image/*,video/*" multiple hidden
      onchange="previewFiles(this.files)">

    <input id="files" type="file" hidden
      onchange="showFileInfo(this.files)">

    <div id="message" role="status" aria-live="polite"></div>

    <h2>Quick Apps</h2>

    <div class="grid">
      <button class="item" onclick="go('https://www.youtube.com/')">
        <span class="emoji">▶️</span>YouTube
      </button>

      <button class="item" onclick="go('https://www.google.com/')">
        <span class="emoji">🔎</span>Google
      </button>

      <button class="item" onclick="go('https://www.instagram.com/')">
        <span class="emoji">📸</span>Instagram
      </button>

      <button class="item" onclick="go('https://www.tiktok.com/')">
        <span class="emoji">🎵</span>TikTok
      </button>
    </div>
  </main>

  <footer>
    iOS Device Hub · Independent web portal
    <br>
    Website ini tidak dapat mengambil alih kontrol sistem iOS.
  </footer>

  <script>
    const message = document.getElementById("message");
    const camera = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const cameraActions = document.getElementById("cameraActions");

    let cameraStream = null;
    let recorder = null;
    let recordedChunks = [];

    function showMessage(html) {
      message.innerHTML = html;
      message.style.display = "block";
      message.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function showGuide(type) {
      const guides = {
        brightness: `
          <strong>☀️ Atur kecerahan layar</strong><br>
          1. Usap ke bawah dari pojok kanan atas iPhone
             untuk membuka Control Center.<br>
          2. Geser slider kecerahan matahari.<br>
          3. Jika perlu, buka Settings → Display & Brightness.<br>
          <small>Website tidak memiliki akses langsung ke slider
          kecerahan sistem.</small>`,

        flashlight: `
          <strong>🔦 Nyalakan senter iPhone</strong><br>
          1. Buka Control Center dengan mengusap ke bawah
             dari pojok kanan atas.<br>
          2. Ketuk ikon senter.<br>
          3. Tekan lama ikon untuk menyesuaikan intensitas,
             jika didukung perangkat.<br>
          <small>Safari tidak menyediakan API untuk menyalakan
          senter sistem secara langsung.</small>`,

        home: `
          <strong>🏠 Tambahkan ke Home Screen</strong><br>
          1. Buka halaman ini menggunakan Safari.<br>
          2. Ketuk tombol Share (ikon kotak dengan panah).<br>
          3. Pilih Add to Home Screen.<br>
          4. Ketuk Add.<br>
          <small>Nama menu dapat berbeda menurut versi iOS.</small>`
      };

      showMessage(guides[type]);
    }

    function go(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function openSafari() {
      showMessage(`
        <strong>🧭 Buka dengan Safari</strong><br>
        Jika halaman ini dibuka di browser lain, salin alamat
        website lalu tempelkan di Safari.<br>
        <button class="action" onclick="copyAddress()">
          Salin alamat halaman
        </button>
      `);
    }

    async function copyAddress() {
      try {
        await navigator.clipboard.writeText(location.href);
        showMessage("Alamat halaman berhasil disalin.");
      } catch {
        showMessage("Salin alamat website dari kolom alamat browser.");
      }
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        showMessage("Kamera tidak tersedia. Buka halaman melalui HTTPS di browser yang mendukung kamera.");
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        });

        camera.srcObject = cameraStream;
        camera.hidden = false;
        cameraActions.hidden = false;

        showMessage("Kamera aktif setelah izin diberikan. Ketuk Tutup Kamera untuk menghentikan akses.");
      } catch (error) {
        showMessage("Kamera tidak dapat dibuka: " + error.message +
          ". Periksa izin kamera di pengaturan browser.");
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }

      camera.srcObject = null;
      camera.hidden = true;
      cameraActions.hidden = true;
      showMessage("Kamera telah dihentikan.");
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function takePhoto() {
      if (!cameraStream || !camera.videoWidth) {
        showMessage("Aktifkan kamera terlebih dahulu.");
        return;
      }

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;
      canvas.getContext("2d").drawImage(
        camera, 0, 0, canvas.width, canvas.height
      );

      canvas.toBlob(blob => {
        if (blob) downloadBlob(blob, "foto-iphone.jpg");
      }, "image/jpeg", 0.92);
    }

    function toggleRecording() {
      if (!cameraStream) {
        showMessage("Aktifkan kamera terlebih dahulu.");
        return;
      }

      if (recorder?.state === "recording") {
        recorder.stop();
        return;
      }

      if (!window.MediaRecorder) {
        showMessage("Browser ini tidak mendukung perekaman video melalui MediaRecorder.");
        return;
      }

      recordedChunks = [];

      const track = cameraStream.getVideoTracks()[0];
      const mimeType = MediaRecorder.isTypeSupported("video/mp4")
        ? "video/mp4"
        : "video/webm";

      try {
        recorder = new MediaRecorder(cameraStream, { mimeType });
      } catch {
        recorder = new MediaRecorder(cameraStream);
      }

      recorder.ondataavailable = event => {
        if (event.data.size > 0) recordedChunks.push(event.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(recordedChunks, {
          type: recorder.mimeType || "video/webm"
        });

        const ext = blob.type.includes("mp4") ? "mp4" : "webm";
        downloadBlob(blob, "video-iphone." + ext);
        showMessage("Rekaman selesai. Simpan video melalui unduhan browser.");
      };

      recorder.start();
      showMessage("Perekaman dimulai. Tekan tombol lagi untuk berhenti.");
    }

    function previewFiles(files) {
      const preview = document.getElementById("preview");
      preview.replaceChildren();

      for (const file of files) {
        const item = document.createElement("div");
        item.style.marginTop = "14px";

        const label = document.createElement("p");
        label.textContent = file.name + " · " +
          (file.size / 1024 / 1024).toFixed(2) + " MB";
        item.appendChild(label);

        const url = URL.createObjectURL(file);
        let media;

        if (file.type.startsWith("image/")) {
          media = document.createElement("img");
        } else if (file.type.startsWith("video/")) {
          media = document.createElement("video");
          media.controls = true;
        } else {
          continue;
        }

        media.src = url;
        media.style.maxWidth = "100%";
        media.style.maxHeight = "320px";
        item.appendChild(media);
        preview.appendChild(item);
      }
    }

    function showFileInfo(files) {
      if (!files.length) return;

      const file = files[0];
      showMessage(
        "<strong>File dipilih</strong><br>" +
        "Nama: " + escapeHtml(file.name) + "<br>" +
        "Tipe: " + escapeHtml(file.type || "Tidak diketahui") + "<br>" +
        "Ukuran: " + (file.size / 1024).toFixed(1) + " KB"
      );
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }
  </script>
</body>
</html>
